<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ★ 1. ブラウザのタブや検索結果に表示されるタイトル -->
  <title>【9期生紹介】</title>

  <!-- ★ 2. 検索結果や共有時に表示される説明文 -->
  <meta name="description" content="【説明会来てくれてありがとう】">

  <!-- ★ 3. LINEやSNSで共有したときの表示（OGP設定） -->
  <meta property="og:title" content="【9期生を紹介するよ】">
  <meta property="og:description" content="【9期生を紹介するよ】">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://0831-0141.github.io/-/">

  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      background: #75BFF3;
    }

    /* 人物一覧 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }

    /* 人物のマス */
    .person {
      height: 350px;
      border: 1px solid #ccc;
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      line-height: 1.4;

      font-size: 22px;
      font-weight: bold;
      font-family: "Hiragino Sans", "ヒラギノ角ゴ ProN", "Meiryo", sans-serif;

      cursor: pointer;
    }

    /* 写真を表示する画面 */
    .photo-page {
      display: none;

      height: 100vh;

      align-items: center;
      justify-content: center;
    }

    /* 写真 */
    .photo-page img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    /* 戻るボタン */
    .back {
      position: fixed;

      top: 10px;
      left: 10px;

      padding: 8px 14px;

      border: none;
      border-radius: 5px;

      background: black;
      color: white;
    }

  </style>
</head>


<body>

  <!-- 9期紹介コーナー -->

  <div id="list" class="grid">

    <!-- style="background: 色コード;" で個別に背景色を指定 -->
    <div class="person" style="background: #FFFCBF;" onclick="showPhoto(1)">
      会田 葵<br>(アイダ アオイ)
    </div>

    <div class="person" style="background: #FFDEAD;" onclick="showPhoto(2)">
      泉谷 宗汰<br>(イズタニ ソウタ)
    </div>

    <div class="person" style="background: #FEA9D4;" onclick="showPhoto(3)">
      市岡 佑梨菜<br>(イチオカ ユリナ)
    </div>

    <div class="person" style="background: #fedd00;" onclick="showPhoto(4)">
      上野 さくら<br>(ウエノ サクラ)
    </div>

    <div class="person" style="background: #afeeee;" onclick="showPhoto(5)">
      大塚 稜乃<br>(オオツカ リノ)
    </div>

    <div class="person" style="background: #9acd32;" onclick="showPhoto(6)">
      大野 萌衣<br>(オオノ メイ)
    </div>

    <div class="person" style="background: #cd5c5c;" onclick="showPhoto(7)">
      菅原 月碧<br>(スガワラ ルイ)
    </div>

    <div class="person" style="background: #81D7D3;" onclick="showPhoto(8)">
      椙山 真衣<br>(スギヤマ マイ)
    </div>

    <div class="person" style="background: #9370db;" onclick="showPhoto(9)">
      鈴木 彩花<br>(スズキ アヤカ)
    </div>

    <div class="person" style="background: #DCDCDC;" onclick="showPhoto(10)">
      田中 大翔<br>(タナカ ヒロト)
    </div>

    <div class="person" style="background: #1E90FF;" onclick="showPhoto(11)">
      根津 柚花<br>(ネヅ ユズカ)
    </div>

    <div class="person" style="background: #FFA500;" onclick="showPhoto(12)">
      東久保 結衣<br>(ヒガシクボ ユイ)
    </div>

    <div class="person" style="background: #FF69B4;" onclick="showPhoto(13)">
      村山 美緒梨<br>(ムラヤマ ミオリ)
    </div>

    <div class="person" style="background: #FFFFF0;" onclick="showPhoto(14)">
      10期生を<br>待ってるよ★
    </div>

  </div>


  <!-- 写真表示画面 -->

  <div id="photoPage" class="photo-page">

    <button class="back" onclick="backToList()">
      ← 戻る
    </button>

    <img id="photo" src="" alt="人物写真">

  </div>


  <script>

    /* 人物をタップしたとき */

    function showPhoto(number) {

      // 人物一覧を隠す
      document.getElementById("list").style.display = "none";

      // 写真画面を表示
      document.getElementById("photoPage").style.display = "flex";

      // 写真を表示
      document.getElementById("photo").src =
        "images/person" + number + ".jpg";
    }


    /* 戻るボタンを押したとき */

    function backToList() {

      // 写真画面を隠す
      document.getElementById("photoPage").style.display = "none";

      // 人物一覧を表示
      document.getElementById("list").style.display = "grid";

    }

  </script>

</body>

</html>

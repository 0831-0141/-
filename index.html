<script>

    // ★ 人物ごとの説明文の一覧
    const descriptions = {
      1: "会田 葵さんの説明文（例：企画担当 / 特技：イラスト）",
      2: "泉谷 宗汰さんの説明文（例：広報担当 / ひとことメッセージ）",
      3: "市岡 佑梨菜さんの説明文",
      4: "上野 さくらさんの説明文",
      5: "大塚 稜乃さんの説明文",
      6: "大野 萌衣さんの説明文",
      7: "菅原 月碧さんの説明文",
      8: "椙山 真衣さんの説明文",
      9: "鈴木 彩花さんの説明文",
      10: "田中 大翔さんの説明文",
      11: "根津 柚花さんの説明文",
      12: "東久保 結衣さんの説明文",
      13: "村山 美緒梨さんの説明文",
      14: "水野 学先生の説明文"
    };

    /* 人物をタップしたとき */
    function showPhoto(number) {
      // 人物一覧を隠す
      document.getElementById("list").style.display = "none";

      // 写真画面を表示
      document.getElementById("photoPage").style.display = "flex";

      // 写真を表示
      document.getElementById("photo").src = "images/person" + number + ".jpg";

      // ★ 説明文を表示
      document.getElementById("photoDesc").textContent = descriptions[number] || "";
    }

    /* 戻るボタンを押したとき */
    function backToList() {
      // 写真画面を隠す
      document.getElementById("photoPage").style.display = "none";

      // 人物一覧を表示
      document.getElementById("list").style.display = "grid";
    }

  </script>

<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロジェクト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px 50px;
      background-color: #F3F6FA;
      color: #27364B;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.9;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      display: inline-block;
      margin: 0;
      padding: 0 12px 8px;
      font-size: 30px;
      border-bottom: 4px solid #7CA6D8;
    }

    .photo {
      width: 100%;
      max-width: 375px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin: 0 auto 28px;
      border-radius: 12px;
    }

    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background-color: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(39, 54, 75, 0.07);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      color: #365D91;
    }

    p {
      margin: 0;
      font-size: 16px;
    }

    .highlight {
      color: #477DBB;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px 40px;
      }

      h1 {
        font-size: 26px;
      }

      .content {
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>

</head>

<body>

  <header>
    <h1>プロジェクト</h1>
  </header>

<img
src="images/Page3foto1.jpg"
alt="商品開発プロジェクトの活動風景"
class="photo"

>

  <section class="content">
    <h2>コンテストに挑戦！</h2>

<p>
  我々は商品開発のゼミなので、<span class="highlight">商品開発系のコンテスト</span>に出ています。<br><br>

  合同説明会でもお話しした通り、目標は、全国の商品開発ゼミが集うコンテスト「Sカレ」で優勝することです！<br><br>

  そのために、まずはさまざまなコンテストに参加して、自分たちがどんな考え方で他のチームと戦えるのかを探りながら、経験を積み、コンテストの雰囲気をつかんでいきます。<br><br>

  小規模なものは、大喜利のような「吹き出し」コンテストから、大規模なものは企業から課題をいただくコンテストまで、<span class="highlight">幅広く挑戦しています！</span>
</p>


  </section>
<div style="text-align: center; margin: 30px auto;">
  <a href="home.html" style="
    display: inline-block;
    padding: 12px 28px;
    background-color: #E8D8C3;
    color: #C49A32;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
    border: 1px solid #D8C5AE;
  ">トップページへ戻る</a>
</div>

</body>


</html>

<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワークショップ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px 50px;
      background-color: #F3F6FA;
      color: #27364B;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.9;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      display: inline-block;
      margin: 0;
      padding: 0 12px 8px;
      font-size: 30px;
      border-bottom: 4px solid #7CA6D8;
    }

    .photo {
      width: 100%;
      max-width: 375px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      margin: 0 auto 28px;
      border-radius: 12px;
    }

    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background-color: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(39, 54, 75, 0.07);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      color: #365D91;
    }

    p {
      margin: 0;
      font-size: 16px;
    }

    .highlight {
      color: #477DBB;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px 40px;
      }

      h1 {
        font-size: 26px;
      }

      .content {
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>

</head>

<body>

  <header>
    <h1>ワークショップ</h1>
  </header>

<img
src="images/Page4foto1.jpg"
alt="感情曲線を用いたワークショップの様子"
class="photo"

>

  <section class="content">
    <h2>ここでしかできない体験！</h2>

<p>
  先生はとても人脈が広いお方なので、企業の方が直接授業に来てくださることがあります！<br><br>

  普通に生活しているだけでは絶対に聞けないようなお話を聞いたり、貴重な体験をさせていただいたりできます。<br><br>

  例えば、某新作アイスを発売した会社や、「あったらいいな」を形にする家電を発売している会社など、<span class="highlight">さまざまな企業や大学の方</span>が来てくださいます！<br><br>

  上の写真は、関西の某大学の先生と一緒に「感情曲線」を用いたワークショップを行ったときのものです。
</p>


  </section>
<div style="text-align: center; margin: 30px auto;">
  <a href="home.html" style="
    display: inline-block;
    padding: 12px 28px;
    background-color: #E8D8C3;
    color: #C49A32;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
    border: 1px solid #D8C5AE;
  ">トップページへ戻る</a>
</div>

</body>
</html>

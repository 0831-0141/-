<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>普段の様子｜9期生</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #F3F6FA;
  color: #27364B;
  font-family: "Hiragino Sans", "Meiryo", sans-serif;
  line-height: 1.9;
}

.container {
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  padding: 20px 18px 45px;
}

.header {
  text-align: center;
  padding: 25px 10px 30px;
}

h1 {
  font-size: 32px;
  margin: 0;
  letter-spacing: 3px;
  color: #243B5A;
}

.header-line {
  width: 55px;
  height: 4px;
  background-color: #78A6D6;
  border-radius: 5px;
  margin: 16px auto 0;
}

.photo {
  display: block;
  width: 100%;
  max-width: 375px;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  margin: 0 auto;
  border-radius: 14px;
  background-color: #DFE8F2;
}

.section {
  margin: 24px auto 30px;
  padding: 23px 22px;
  width: 100%;
  max-width: 600px;
  background-color: #FFFFFF;
  border-radius: 14px;
  border: 1px solid #E1E8F0;
  box-shadow: 0 3px 10px rgba(36, 59, 90, 0.04);
}

h2 {
  font-size: 23px;
  line-height: 1.6;
  margin: 0 0 12px;
  color: #243B5A;
}

p {
  font-size: 15px;
  margin: 0;
  overflow-wrap: anywhere;
}

.highlight {
  font-weight: bold;
  color: #3676B9;
  background: linear-gradient(transparent 65%, #DCEBFA 65%);
}

.last-message {
  margin: 24px auto 0;
  padding: 28px 22px;
  width: 100%;
  max-width: 600px;
  background-color: #DCEBFA;
  border-radius: 14px;
  border: 1px solid #C7DDF3;
  text-align: center;
}

.last-message h2 {
  font-size: 25px;
  margin-bottom: 12px;
}

@media (max-width: 480px) {
  .container {
    padding: 15px 14px 35px;
  }

  h1 {
    font-size: 28px;
  }

  .photo {
    aspect-ratio: 4 / 3;
    border-radius: 11px;
  }

  .section {
    padding: 20px 17px;
    margin: 18px auto 25px;
  }

  h2 {
    font-size: 20px;
  }

  p {
    font-size: 14px;
  }

  .last-message {
    padding: 24px 17px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1>普段の様子</h1>
    <div class="header-line"></div>
  </header>

  <img
    class="photo"
    src="images/Page1foto1.jpg"
    alt="9期生の日常写真"
  >

  <section class="section">
    <h2>13人で切磋琢磨！</h2>
    <p>
      我々9期生は、<span class="highlight">男3人・女10人の計13人</span>で、
      日々楽しく切磋琢磨しています！
    </p>
  </section>

  <img
    class="photo"
    src="images/Page1foto2.jpg"
    alt="9期生の活動風景"
  >

  <section class="section">
    <h2>ゼミがない日も活動中！</h2>
    <p>
      心がけていることでもあるのですが、ゼミがない日でも集まって
      話し合いや作業をすることが多いです！
      それくらい、みんなで協力して活動しています。
    </p>
  </section>

  <img
    class="photo"
    src="images/Page1foto3.jpg"
    alt="9期生の普段の様子"
  >

  <section class="section">
    <h2>13人13色！</h2>
    <p>
      13人13色で、似ている人がいません！
      だからこそ、全員が必要不可欠な仲間です。
      意見がぶつかることもありますが、それも含めて楽しく活動しています！
    </p>
  </section>

  <section class="last-message">
    <h2>基本、自由！</h2>
    <p>
      基本自由！その分、自分の首は自分で思いっきり締め付けられる……
      という捉え方もできます（笑）。
    </p>
  </section>

<div style="text-align: center; margin: 30px auto;">
  <a href="home.html" style="
    display: inline-block;
    padding: 12px 28px;
    background-color: #E8D8C3;
    color: #C49A32;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
    border: 1px solid #D8C5AE;
  ">トップページへ戻る</a>
</div>


</body>
</html>

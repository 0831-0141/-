<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>写メール｜9期生</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #F3F6FA;
    color: #27364B;
    font-family: "Hiragino Sans", "Meiryo", sans-serif;
    line-height: 1.9;
}

.container {
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
    padding: 20px 18px 45px;
}

/* タイトル */
.header {
    text-align: center;
    padding: 25px 10px 30px;
}

h1 {
    font-size: 32px;
    margin: 0;
    letter-spacing: 3px;
    color: #243B5A;
}

.header-line {
    width: 55px;
    height: 4px;
    background-color: #78A6D6;
    border-radius: 5px;
    margin: 16px auto 0;
}

/* 写真 */
.photo {
    display: block;
    width: 100%;
    max-width: 375px;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    margin: 0 auto;
    border-radius: 14px;
    background-color: #DFE8F2;
}

/* 文章カード */
.section {
    margin: 24px auto 30px;
    padding: 23px 22px;
    width: 100%;
    max-width: 600px;
    background-color: #FFFFFF;
    border-radius: 14px;
    border: 1px solid #E1E8F0;
    box-shadow: 0 3px 10px rgba(36, 59, 90, 0.04);
}

h2 {
    font-size: 23px;
    line-height: 1.6;
    margin: 0 0 12px;
    color: #243B5A;
}

p {
    font-size: 15px;
    margin: 0;
    overflow-wrap: anywhere;
}

.highlight {
    font-weight: bold;
    color: #3676B9;
    background: linear-gradient(transparent 65%, #DCEBFA 65%);
}

/* スマホ */
@media (max-width: 480px) {
    .container {
        padding: 15px 14px 35px;
    }

    h1 {
        font-size: 28px;
    }

    .photo {
        aspect-ratio: 4 / 3;
        border-radius: 11px;
    }

    .section {
        padding: 20px 17px;
        margin: 18px auto 25px;
    }

    h2 {
        font-size: 20px;
    }

    p {
        font-size: 14px;
    }
}
</style>
</head>

<body>
<div class="container">

<header class="header">
    <h1>写メール</h1>
    <div class="header-line"></div>
</header>

<!-- 写真1 -->
<img class="photo" src="images/Page2foto1.jpg" alt="写メールの活動風景">

<!-- 説明1 -->
<section class="section">
    <h2>写メールとは？</h2>
    <p>
        制限時間は<span class="highlight">3分間</span>。
        決められた場所の中から<br>
        マーケティング的に面白いと思ったところを見つけ<br>
        名前の通り自分で撮った写真だけを使ってプレゼンする<span class="highlight">対決企画です！</span>
    </p>
</section>

<!-- 写真2 -->
<img class="photo" src="images/Page2foto2.jpg" alt="写メールのプレゼン風景">

<!-- 説明2 -->
<section class="section">
    <h2>目的</h2>
    <p>
        3分間で伝えたいことを削ったり、必要な情報を盛り込んだり。
        話の一貫性を意識しながら、相手に何かを伝える上で必要な能力を鍛えます！
    </p>
</section>
<div style="text-align: center; margin: 30px auto;">
  <a href="home.html" style="
    display: inline-block;
    padding: 12px 28px;
    background-color: #E8D8C3;
    color: #C49A32;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
    border: 1px solid #D8C5AE;
  ">トップページへ戻る</a>
</div>

</body>
</html>
